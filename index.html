<script>
var D=[
["Введение",[
["Предмет философии","Философия изучает самые общие законы бытия, познания и мышления и место человека в мире. Возникла в VII–VI вв. до н. э. в Китае, Индии и Греции. Частные науки изучают отдельные области, философия спрашивает о мире в целом. Слово «философия» (греч. philosophia) переводится как «любовь к мудрости», термин приписывают Пифагору. Предмет философии менялся: у греков это наука обо всём, в Средние века служанка богословия, в Новое время теория познания и метода, сегодня наиболее общие основания бытия, познания, ценностей и человеческого существования. Основные разделы: онтология (учение о бытии), гносеология (о познании), этика, эстетика, логика, социальная философия, антропология."],
["Основной вопрос, 1-я сторона","Что первично: материя или сознание? <b>Материалисты</b> (Демокрит, Гольбах) считают первичной материю, <b>идеалисты</b> (Платон, Беркли) считают первичным дух, идею, сознание. <b>Дуалисты</b> (Декарт) признают обе субстанции. Есть и монизм: материалистический (всё из материи) и идеалистический (всё из духа). От ответа на этот вопрос зависит, как философ понимает мир, познание и человека."],
["Основной вопрос, 2-я сторона","Познаваем ли мир и есть ли истина? Оптимисты говорят «да», <b>агностики</b> (Юм) сомневаются в полноте знания, <b>скептики</b> сомневаются в самой возможности достоверного знания. Истина — знание, соответствующее объекту; бывает абсолютной и относительной, критерий — практика."],
["Миф, религия, философия","Мировоззрение — взгляд на мир и своё место в нём. <b>Миф</b> объясняет мир образами богов и героев. <b>Религия</b> опирается на веру, культ и священные тексты. <b>Философия</b> опирается на разум, логику и доказательства. Миф и религия держатся на вере, философия на аргументах. Миф синкретичен: он сливает знание, религию, искусство и мораль и рассказывает, «как всё началось». Религия добавляет догматы, обряды и церковь как организацию. Философия даёт не готовый ответ, а вопрос и доказательство: любую мысль можно проверить и оспорить. Философия выросла из мифа, но отказалась объяснять мир волей богов."],
["Мировые религии","<b>Буддизм</b> (VI–V вв. до н. э., Будда), <b>христианство</b> (I в., Иисус Христос, Библия), <b>ислам</b> (VII в., Мухаммед, Коран, единобожие). Религия регулирует отношения людей: задаёт мораль, объединяет общими ценностями, закрепляет традиции."],
["Формы мифа","<b>Тотемизм</b> — вера в родство рода с животным или растением. <b>Фетишизм</b> — поклонение вещам. <b>Магия</b> — вера, что обрядами можно влиять на события. <b>Анимизм</b> — вера в души и духов, одушевление природы."],
["Функции философии","Мировоззренческая, методологическая (даёт методы другим наукам), познавательная, ценностная (что такое добро и справедливость), критическая, гуманистическая, прогностическая, интегрирующая. Например, методологическая функция: философия даёт науке общие способы мышления (логику, диалектику). Мировоззренческая помогает человеку выстроить целостную картину мира и определить свои ценности. Критическая учит сомневаться и проверять, а не принимать на веру. Поэтому философия не набор абстрактных понятий, а практический способ ориентироваться в мире."],
["Зачем изучать историю философии","Каждая идея — этап развития мысли, и современные проблемы не понять без прошлого. История философии учит самостоятельно мыслить, видеть разные точки зрения и определять собственную позицию."]
]],
["Древний Восток",[
["Философия Древнего Китая","Возникла в VII–III вв. до н. э. Практична: гармония человека, общества и природы, этика и управление. Школы: даосизм, конфуцианство, моизм, легизм. Сформировала нравственные основы китайского общества."],
["Учение о Дао","Основатель — Лао-цзы, текст «Дао дэ цзин». <b>Дао</b> — «путь», первооснова и закон мира, из него всё рождается. Принцип <b>у-вэй</b> (недеяние): не вмешиваться в естественный ход вещей. Мир держится на единстве противоположностей (инь и ян). Дао невозможно выразить словами. Мудрый живёт просто, как вода, которая мягка, но точит камень. Идеи Лао-цзы развил Чжуан-цзы (притча о бабочке: где сон, а где явь)."],
["Конфуций","Этико-политическое учение («Лунь юй»). <b>Жэнь</b> — человеколюбие, <b>ли</b> — ритуал и нормы, <b>сяо</b> — почитание родителей, <b>цзюньцзы</b> — «благородный муж». Государство как большая семья. Сегодня в Китае это уважение к старшим, образованию, семье и порядку. Конфуций учил, что государством должен править нравственный пример, а не наказание: если правитель добродетелен, народ подражает ему. Золотое правило: не делай другим того, чего не желаешь себе. Образование он считал путём к нравственности и учил не только знатных. Конфуцианство веками определяло систему экзаменов для китайских чиновников."],
["Древнеиндийская философия","Опирается на Веды и Упанишады, тесно связана с религией. Цель — освобождение (<b>мокша</b>), идея перерождений. Школы признающие Веды (санкхья, йога, веданта и др.) и не признающие (чарвака, джайнизм, буддизм)."],
["Джайнизм","Основатель — Махавира (VI в. до н. э.). Мир состоит из живого (<b>джива</b>) и неживого. Освобождение достигается аскезой и нравственной жизнью. Главный принцип — <b>ахимса</b>, непричинение вреда живому."],
["Буддизм и другие течения","Будда (Сиддхартха Гаутама): жизнь есть страдание, причина — желания и привязанность, страдание можно прекратить, путь — «восьмеричный». Цель — <b>нирвана</b>. «Срединный путь» между роскошью и аскезой. Ещё есть материалистическая чарвака (локаята) и веданта (единство атмана и брахмана). Восьмеричный путь включает правильное воззрение, намерение, речь, действие, образ жизни, усилие, памятование и сосредоточение. Всё в мире непостоянно и не имеет неизменной «самости» (анатман), а страдание вызывают желание и неведение."],
["Пуруша, Брахман, Атман, Сансара, Карма, Нирвана","<b>Пуруша</b> — духовное начало (санкхья). <b>Брахман</b> — абсолют, первооснова мира. <b>Атман</b> — индивидуальная душа. <b>Сансара</b> — круг рождений и смертей. <b>Карма</b> — закон воздаяния за поступки. <b>Нирвана</b> — освобождение от страдания и перерождений."]
]],
["Античность",[
["Предпосылки греческой философии","Развитие торговли, ремёсел, мореплавания, колонизация; полисы и демократия с публичными спорами; свободное время граждан; кризис мифологии; развитие математики и астрономии; знакомство с Востоком."],
["Натурфилософия: Милет и Элея","Поиск первоосновы (<b>архэ</b>). <b>Милет:</b> Фалес — вода, Анаксимандр — апейрон, Анаксимен — воздух. <b>Элея:</b> Ксенофан, Парменид, Зенон — учение о бытии и разуме."],
["Гераклит и Пифагор","<b>Гераклит:</b> первооснова огонь, «всё течёт», развитие через борьбу противоположностей, мир подчиняется <b>логосу</b>. <b>Пифагор:</b> основа мира — число и гармония, учение о переселении душ, математика и теория музыки. Гераклит говорил, что в одну реку нельзя войти дважды, потому что всё меняется; но изменения подчиняются логосу, то есть закону и мере. Его диалектика видит в борьбе противоположностей источник развития. Пифагорейцы открыли, что гармонию звука можно выразить числовыми отношениями, и сделали вывод, что весь космос устроен по числам; им традиционно приписывают теорему о сторонах прямоугольного треугольника."],
["Демокрит","Мир состоит из <b>атомов</b> (вечных неделимых частиц) и пустоты. Атомы различаются формой и размером, движутся и соединяются в вещи. Всё подчинено необходимости, случайность — незнание причин. Душа тоже из атомов. Атомы различаются формой, поэтому из них получаются разные вещи: например, атомы огня круглые и подвижные. Миров бесчисленное множество, они возникают и гибнут. Познание бывает «тёмным» (через чувства, оно неточно) и «истинным» (через разум, он видит атомы). В этике Демокрит учил, что счастье это «благодушие», спокойствие души, которого достигают умеренностью и знанием."],
["Сократ","Повернул философию от природы к человеку. «Познай самого себя». Добродетель есть знание. Метод — диалог: <b>ирония</b> (показать незнание собеседника) и <b>майевтика</b> (помочь родить истину вопросами). Осуждён и принял яд (399 г. до н. э.). Его обвинили в неуважении к богам и развращении молодёжи. Мудрость, по Сократу, начинается со знания собственного незнания, а зло человек совершает по неведению. Он поставил в центр философии нравственный вопрос: как жить правильно."],
["Платон: эйдос и демиург","Основал Академию, объективный идеалист. <b>Эйдосы</b> (идеи) вечны и существуют в мире идей, вещи — их копии. Высшая идея — Благо. <b>Демиург</b> — божественный мастер, который по образцу идей творит мир из материи. Познание — припоминание («миф о пещере»). Люди в пещере видят лишь тени на стене (чувственный мир), а философ выходит наружу и видит настоящие вещи и Солнце (идею Блага). Душа делится на три части (разумную, волевую, вожделеющую), она бессмертна и существовала до тела. Платон — главный представитель объективного идеализма: общее (идея) существует раньше и независимо от отдельных вещей."],
["Идеальное государство Платона","Три сословия: правители-философы (мудрость), стражи-воины (мужество), производители (умеренность). Справедливость — когда каждый занят своим делом. У правителей и стражей нет частной собственности и семьи. Критиковал демократию. Платон делил и душу, и государство на три части: разум правит, воля защищает, желания подчиняются. Воспитание правителей и стражей строится на гимнастике, музыке и философии, а отбор идёт по способностям, а не по рождению. Он считал, что демократия легко вырождается в тиранию, потому что толпа выбирает льстецов, а не знающих. В поздних «Законах» Платон смягчил проект и допустил частную собственность."],
["Аристотель: логика","Ученик Платона, основал Ликей. Создал формальную логику («Органон»): учение о силлогизме, понятиях, суждениях, законы мышления (непротиворечия, исключённого третьего). Пример: все люди смертны, Сократ — человек, значит смертен. Аристотель различал суждения общие и частные, утвердительные и отрицательные и описал десять категорий (сущность, количество, качество, отношение, место, время и др.). Логика для него не часть философии, а инструмент («органон») для всех наук. Его логика использовалась более двух тысяч лет."],
["Аристотель: метафизика","«Первая философия» — наука о бытии. Критикует Платона: идеи не существуют отдельно от вещей. Вещь = материя + форма. Четыре причины: материальная, формальная, действующая, целевая. Первопричина — «неподвижный перводвигатель». Материя — то, из чего вещь сделана (мрамор), форма — то, чем она является (статуя). Движение — переход от возможного к действительному: семя становится деревом. Перводвигатель — чистая форма и чистая мысль, он движет миром как предмет стремления, а не толкает его. Аристотель сочетает идеалистические и материалистические черты, поэтому его считают колеблющимся между ними."],
["Аристотель: мир, жизнь, человек","Мир вечен, природа целесообразна. Душа — форма тела (растительная, животная, разумная). Человек — «политическое животное». Добродетель — «золотая середина» (мужество между трусостью и безрассудством). Цель жизни — счастье (эвдемония). Этические добродетели (мужество, щедрость, умеренность) вырабатываются привычкой, а дианоэтические (мудрость, разумность) обучением. Высшее счастье, по Аристотелю, созерцание истины, жизнь разума. Государство возникает естественным путём из семьи и деревни и существует ради хорошей жизни граждан; лучшей формой он считал «политию», умеренное правление среднего слоя."],
["Зенон и Парменид","<b>Парменид:</b> бытие есть, небытия нет; бытие едино, неподвижно, вечно; мышление и бытие тождественны; чувства обманывают. <b>Зенон:</b> апории («Ахиллес и черепаха», «Стрела») показывают противоречивость движения."],
["Эпикур и гедонизм","Высшее благо — удовольствие, но понимаемое как отсутствие боли (<b>апония</b>) и тревоги (<b>атараксия</b>). Для этого нужны умеренность, разумная жизнь и дружба. Не нужно бояться богов и смерти. Атомы могут отклоняться, отсюда свобода воли. Эпикур делил желания на естественные и необходимые (еда, питьё), естественные, но не необходимые, и пустые (слава, богатство); удовлетворять нужно только первые. Философия для него лекарство для души; школа «Сад» в Афинах принимала и женщин, и рабов. Боги существуют, но не вмешиваются в дела мира."],
["Тит Лукреций Кар","Римский поэт-философ, поэма «О природе вещей». Излагает атомизм Демокрита и Эпикура: ничто не возникает из ничего, мир из атомов и пустоты, душа смертна, богов и смерти бояться не нужно."]
]],
["Христианская философия Средних веков",[
["Философия в рамках веры","Главная идея — <b>теоцентризм</b>: Бог в центре, вера выше разума, философия — «служанка богословия». Опора на Писание и отцов церкви. Метод — схоластика. Проблемы: бытие Бога, вера и разум, свобода воли, происхождение зла."],
["Патристика и Августин","Патристика — отцы церкви (II–VIII вв.). Августин Блаженный («Исповедь», «О граде Божьем») соединил христианство с платонизмом: Бог — высшее благо, зло — отсутствие добра, спасение — дар благодати, история — борьба «града Божьего» и «града земного». Время, по Августину, существует в душе: прошлое — память, настоящее — внимание, будущее — ожидание. У человека есть свобода воли, но после грехопадения он склонен ко злу, поэтому нуждается в благодати. Августин — главный христианский платоник, его идеи влияли на всё западное богословие."],
["Томизм: Фома Аквинский","Вершина схоластики («Сумма теологии»). Приспособил Аристотеля к христианству: вера и разум не противоречат, философия служит богословию. Дал пять доказательств бытия Бога. Стал официальной философией католической церкви. Пять путей: от движения к перводвигателю, от действующей причины к первопричине, от случайного к необходимому, от степеней совершенства к высшему совершенству, от целесообразности к разумному Творцу. Философия изучает то, что доступно разуму, а богословие то, что открыто верой; противоречия нет, потому что источник обоих — Бог."],
["Номинализм и реализм","Спор об общих понятиях (универсалиях). <b>Реализм</b> (Ансельм, Фома): общие понятия реально существуют. <b>Номинализм</b> (Росцелин, Оккам): реальны лишь отдельные вещи, общие понятия — только имена. Оккам: «не умножай сущности без необходимости». Спор шёл о том, существует ли «человек вообще» или только отдельные люди. Реалисты считали, что общее реально и первично (как у Платона), тогда у истин веры и церкви есть прочная основа. Номинализм вёл к выводу, что знание строится на опыте и отдельных вещах, поэтому его считают шагом к опытной науке Нового времени."],
["Первородный грех и креационизм","<b>Первородный грех:</b> Адам и Ева нарушили запрет Бога, грех передаётся всем людям, искупление через Христа. <b>Креационизм:</b> Бог сотворил мир из ничего свободной волей, мир имеет начало во времени."]
]],
["Мусульманская философия",[
["Предпосылки возникновения","Арабский халифат (VIII–XII вв.), объединение разных народов, расцвет городов и торговли, потребность в науках, переводы античных текстов (Дом мудрости в Багдаде), развитие богословия (калам)."],
["Аль-Кинди","IX в., «философ арабов», первый крупный представитель восточного перипатетизма. Организовал переводы, согласовывал философию и религию. Бог — Единое и творец мира, учил об уме, классифицировал науки."],
["Аль-Фараби: продолжатель Аристотеля","Абу Наср аль-Фараби (870–950), родом из Отрара, «Второй учитель» (после Аристотеля). Комментировал Аристотеля, развил логику, классификацию наук, учение о бытии, уме и обществе. Соединял Платона, Аристотеля и ислам. Он написал «Классификацию наук» и комментарии к Аристотелю, развил логику как инструмент всех наук. Бытие, по Фараби, делится на возможное и необходимое, а Бог первая причина и необходимо сущее. Он родился в Фарабе (Отрар) на территории современного Казахстана, поэтому его считают гордостью казахской культуры; трактаты написал на арабском языке. Он также автор «Большой книги музыки»."],
["Аль-Фараби: добродетельный город","Идеальное общество, где люди объединены ради счастья. Город подобен организму, где сердце — правитель. Правитель — мудрец-философ, близкий к пророку. Противопоставлены «невежественные», «порочные» и «заблудшие» города. В невежественных городах люди ищут богатство, власть или удовольствия и не знают истинного счастья. Условия добродетельного города: согласие, знание и взаимопомощь. Правитель должен обладать двенадцатью врождёнными качествами (здоровье, ум, память, любовь к знаниям и справедливости и др.). Целью общества служит общее благо и духовное счастье, а не выгода."],
["Аль-Фараби: учение об уме","Четыре вида ума: потенциальный, действительный, приобретённый и деятельный (источник форм, десятый ум). Познание — переход от возможности к действительности. Высшая ступень — соединение с деятельным умом. Деятельный ум Фараби сравнивает с Солнцем: он освещает наш ум и переводит его из возможности в действительность. Деятельный ум — это и космическая сила, десятый ум, связанный с подлунным миром. Так знание становится не только личным делом, но и частью мирового порядка."],
["Ибн Сина","Авиценна (980–1037), философ и врач, «Книга исцеления», «Канон врачебной науки». Различал сущность и существование: только Бог — «необходимо сущий». Развил учение об эманации и о душе (растительная, животная, разумная). В «Каноне» описано около 760 лекарственных средств, болезни и методы лечения; книга служила врачам Востока и Европы до XVII века. Мир, по Ибн Сине, вечен, но не самостоятелен: он существует благодаря Богу как причине. Душа бессмертна и продолжает существовать после смерти тела."],
["Эманация","«Истечение»: мир последовательно порождается из Единого (Бога), как свет от солнца. От Единого исходит первый ум, дальше ряд умов и небесных сфер (всего десять). Так объясняется, как из единства возникает множественность. Схема такая: от Первого (Бога) исходит первый ум; он мыслит себя и Первого и порождает второй ум и сферу неба; так образуются девять небесных сфер и десять умов. Последний, десятый ум деятельный: он правит подлунным миром, от него исходят формы вещей и человеческие умы. Идея пришла из неоплатонизма (Плотин) и позволила соединить единобожие ислама с греческой картиной космоса."],
["Пантеизм и «Ай астындағы әлем»","<b>Пантеизм</b> — Бог и природа тождественны (в исламе — суфии, Ибн Араби). <b>Подлунный мир</b> — земной мир под Луной: изменчивый, преходящий, в отличие от вечного небесного."],
["Ибн Рушд","Аверроэс (1126–1198), Кордова, комментатор Аристотеля. Защищал философию от аль-Газали. Истина одна, философия и религия — разные пути к ней. Мир вечен. Повлиял на европейскую схоластику. Он считал, что Коран обращён ко всем людям, в том числе к философам: в Писании есть буквальный и скрытый смысл, а разум помогает его толковать. Он также допускал, что женщины способны к обучению и управлению. В Европе его последователей называли аверроистами; они учили о едином разуме для всего человечества, и церковь осуждала это учение."],
["Ибн Халдун","(1332–1406), «Мукаддима». Основатель социологии и философии истории. История подчиняется закономерностям: родовая сплочённость (<b>асабийя</b>) создаёт государство, потом оно слабеет и сменяется. Климат и география влияют на характер, хозяйство и устройство общества, но не определяют всё. Основа общества, по Ибн Халдуну, взаимопомощь: в одиночку человек не может ни прокормиться, ни защититься. Он различал кочевую цивилизацию (суровую, с сильной сплочённостью) и городскую (богатую, но изнеженную). Государство проходит несколько поколений: основание, укрепление, расцвет, упадок, а затем его завоёвывает новая сплочённая группа. Поэтому Ибн Халдуна считают предшественником социологии и теории циклов истории."]
]],
["Возрождение",[
["Предпосылки Возрождения","XIV–XVI вв., Италия. Рост городов, торговли и банков, кризис церкви и схоластики, интерес к античности, книгопечатание, великие географические открытия. Черты: гуманизм, антропоцентризм, светский характер. Гуманизм — идея ценности человека и его земной жизни; антропоцентризм — в центре внимания человек, а не Бог. Возродился интерес к античному наследию: переводили и издавали древние тексты. Искусство (Леонардо, Микеланджело, Рафаэль) показывало человека красивым и сильным. Культуру создавали уже не только церковь и монастыри, но и светские учёные, художники, придворные. Центрами стали Флоренция, Венеция, Рим."],
["Проблема человека","Человек — творец своей судьбы. <b>Манетти:</b> человек — венец творения. <b>Валла:</b> ценность земной жизни, критика церкви. <b>Пико делла Мирандола:</b> Бог дал человеку свободу самому выбирать, кем быть. По Пико, у человека нет заданной природы: он может подняться до ангелов или опуститься до животных. Традицию начали Петрарка и Боккаччо, а Эразм Роттердамский в «Похвале глупости» высмеял церковные пороки. Общий вывод гуманистов: человек свободный творец самого себя, его достоинство определяют знание, труд и разум, а не происхождение."],
["Макиавелли","«Государь». Политика отделена от морали и религии. Правитель должен быть сильным и расчётливым, ради сохранения государства порой действует хитростью и силой. Понятия: <b>вирту</b> (доблесть) и <b>фортуна</b> (судьба). Цель — сильное единое государство. Правитель должен быть «львом и лисой»: силой побеждать врагов, хитростью избегать ловушек. Лучше, чтобы правителя боялись, чем любили, но нельзя вызывать ненависть. Макиавелли первым сделал политику самостоятельным предметом науки. Слово «макиавеллизм» стало означать циничную политику, хотя сам он мечтал об объединении Италии."],
["Реформация","Движение XVI в. против католической церкви. <b>Лютер</b> (1517): спасение верой, а не индульгенциями, главный авторитет — Библия. <b>Кальвин:</b> учение о предопределении. Реформация освободила мысль от церковной опеки. Лютер перевёл Библию на немецкий, чтобы каждый мог читать её сам, и отверг посредничество церкви между человеком и Богом. По Кальвину, успех в труде считался признаком избранности, поэтому протестантская этика способствовала развитию капитализма (идея М. Вебера)."],
["Научные открытия эпохи","<b>Леонардо да Винчи:</b> опыт, анатомия, механика, изобретения. <b>Коперник:</b> гелиоцентризм. <b>Бруно:</b> бесконечность Вселенной и множество миров, сожжён инквизицией (1600)."],
["Дарвин","«Происхождение видов» (1859). Эволюция через изменчивость, наследственность, борьбу за существование и естественный отбор. Объяснил происхождение человека, подорвал идею неизменности видов и креационизма. Дарвин собрал материал в кругосветном путешествии на корабле «Бигль», особенно наблюдая вьюрков на Галапагосских островах. Отбор бывает естественным (в природе) и искусственным (в селекции). Эволюция идёт медленно, через накопление малых изменений. Идея вызвала споры: она показала, что человек часть природы, и поколебала представление о его особом положении."]
]],
["Новое время и Просвещение",[
["Фрэнсис Бэкон","Основатель эмпиризма («Новый органон»), «Знание — сила». Источник знания — опыт. Нужно очистить разум от «идолов»: рода, пещеры, рынка (ошибки языка), театра (слепая вера авторитетам). Метод — индукция: от фактов к общим выводам. Нужно собирать факты, составлять таблицы присутствия, отсутствия и степеней и из них постепенно выводить общий закон. Бэкон критиковал схоластику и слепое доверие Аристотелю: науку питает опыт, а цель науки — власть человека над природой и улучшение жизни. Учёных он сравнивал с пауками (ткут из себя), муравьями (только собирают) и пчёлами (собирают и перерабатывают). Идеал — пчела."],
["Рене Декарт","Основатель рационализма. Метод — сомнение во всём; несомненно мышление: «Я мыслю, следовательно, существую». Метод — дедукция: от ясных истин к следствиям. Дуалист: мыслящая и протяжённая субстанции, есть врождённые идеи. Правил метода четыре: принимать за истину только ясное и очевидное, делить трудную задачу на части, идти от простого к сложному, делать полные перечни. Доказав своё существование, Декарт выводит существование Бога как совершенного существа, а затем и внешнего мира. Образцом знания для него была математика, он создал аналитическую геометрию."],
["Спиноза","«Этика». Бог = субстанция = природа. Субстанция — причина самой себя, её атрибуты — мышление и протяжение. Отдельные вещи — <b>модусы</b> (состояния субстанции). Всё подчинено необходимости, свобода — осознанная необходимость. Модусы бывают бесконечными и конечными; человек — конечный модус, у него есть тело (модус протяжения) и душа (модус мышления). Высшее благо — «интеллектуальная любовь к Богу», то есть познание природы. Спиноза отвергал личного Бога, вмешивающегося в мир, за что был изгнан из еврейской общины."],
["Лейбниц","Теория <b>монад</b>: мир из бесчисленных простых духовных субстанций. Они «без окон», согласованы Богом («предустановленная гармония»). Высшая монада — Бог. Наш мир — «лучший из возможных». Монады бывают трёх уровней: простые (растения, камни), с ощущением (животные) и с разумом (человек). Пространство и время Лейбниц понимал как порядок отношений между вещами, а не как вместилище. Принцип достаточного основания: ничто не происходит без причины, по которой оно именно такое. Независимо от Ньютона он создал дифференциальное исчисление."],
["Локк","Эмпирик: душа — «чистая доска», знание от опыта. В политике: естественные права (жизнь, свобода, собственность), общественный договор, право народа сменить власть, нарушающую права. <b>Разделение властей.</b> Локк различал власть законодательную, исполнительную и федеративную (внешние дела). Два источника идей: ощущение (внешний опыт) и рефлексия (наблюдение за собственным умом). Его политические идеи повлияли на американскую Декларацию независимости."],
["Особенности философии Просвещения","XVII–XVIII вв. Вера в разум и прогресс, критика феодализма, церкви и предрассудков, естественные права и равенство, ценность образования и науки. Лозунг: «Имей мужество пользоваться собственным умом». Просветители считали, что причина бедствий общества — невежество, и его побеждает образование. Они верили в естественные права, общественный договор и терпимость, критиковали абсолютизм и церковь, но многие (Вольтер) были деистами: признавали Бога как создателя, но отвергали чудеса. Просвещение подготовило революции XVIII века."],
["Английское Просвещение","Опора на опыт, осторожность, вопросы общества и морали. Представители: Локк, Гоббс, Ньютон, Шефтсбери, Юм."],
["Возрождение и Просвещение: отличия","<b>Возрождение:</b> человек-творец, искусство, возврат к античности, ещё религиозно. <b>Просвещение:</b> разум и наука, реформы общества, критика религии, образование для всех."],
["Беркли","Субъективный идеализм: «существовать — значит быть воспринимаемым». Материи нет, вещи — комплексы ощущений. Чтобы мир не исчезал, когда его никто не видит, есть вечный воспринимающий — Бог. Беркли отверг идею «абстрактной материи»: мы знаем только ощущения (цвет, форму, тепло), а вещи их сочетание. Поэтому он субъективный идеалист и решает основной вопрос в пользу сознания. Противники упрекали его во взгляде, близком к солипсизму, но сам Беркли защищал здравый смысл и веру в Бога."],
["Юм","Скептик и агностик. Знание сводится к впечатлениям. Причинность — лишь привычка видеть событие B после A. <b>«Гильотина Юма»:</b> из «есть» нельзя логически вывести «должно быть», факты и ценности — разные области. Юм делил содержание сознания на впечатления (яркие) и идеи (их бледные копии). Он считал, что мы не можем доказать ни материю, ни неизменное «Я»: в себе мы находим лишь поток восприятий. Его идеи пробудили Канта от «догматического сна»."],
["Монтескье","«О духе законов». Законы — отношения, вытекающие из природы вещей. Естественные и социальные (позитивные) законы. Формы правления: республика, монархия, деспотия. На законы влияют климат и размер страны. <b>Разделение властей</b> (законодательная, исполнительная, судебная) гарантирует свободу. Если власти соединены в одних руках, возникает тирания. Принцип республики — добродетель, монархии — честь, деспотии — страх. По мнению Монтескье, климат влияет на нравы: в жарких странах люди склонны к лени и подчинению, в холодных — энергичнее и свободолюбивее."],
["Французское Просвещение и «Энциклопедия»","Вольтер, Монтескье, Руссо, Дидро, Гольбах. «Энциклопедия» (1751–1772, Дидро и д’Аламбер) — свод знаний эпохи. Распространяла идеи разума и науки, критиковала церковь и абсолютизм, подготовила Французскую революцию."],
["Руссо","О неравенстве: в естественном состоянии люди были свободны и равны. Неравенство возникло вместе с частной собственностью и развитием цивилизации. Выход — общественный договор и «общая воля» народа. Руссо различал естественное неравенство (возраст, здоровье, ум) и социальное, которое создают сами люди. Он считал, что развитие наук и искусств не сделало людей лучше, а испортило нравы. В «Общественном договоре» суверенитет принадлежит народу, а закон выражает общую волю. Идеи Руссо повлияли на Французскую революцию."],
["Гольбах","«Система природы». Материалист и атеист: есть только материя в вечном движении, всё подчинено необходимости. Религия — плод невежества и страха. Мораль основана на разумно понятом интересе. Гольбах утверждал, что вера в Бога и душу возникла из страха и незнания природы, а духовенство использует её ради власти. Человек, по нему, несвободен в метафизическом смысле, потому что подчиняется законам природы, но может стать счастливее, если изменить общество и воспитание. Книгу осудили, а издавалась она под чужим именем."],
["Дидро и д’Аламбер","<b>Дидро:</b> главный редактор «Энциклопедии», материалист: материя активна, движение присуще ей изначально. <b>Д’Аламбер:</b> математик, «Введение» к «Энциклопедии», осторожный скептик. Оба верили в разум и прогресс."],
["Шефтсбери","Английский моралист. Человек от природы имеет «нравственное чувство», отличающее добро и зло. Добродетель — гармония личного и общественного. Мораль не зависит от страха перед Богом. Критиковал эгоизм Гоббса."]
]],

["Структура познания","<b>Чувственное:</b> ощущение, восприятие, представление. <b>Рациональное:</b> понятие, суждение, умозаключение. Они дополняют друг друга: без чувств нет материала, без разума нет осмысления."],
["Проблема сознания","Сознание — высшая форма отражения мира, свойственная человеку, связана с мозгом, языком и обществом. Признаки: целеполагание, самосознание, творчество. Идеализм считает его первичным, материализм — свойством высокоорганизованной материи."],

c[1].forEach(function(p){

var b=document.createElement("div");b.className="a";b.innerHTML=p[1];
d.appendChild(m);d.appendChild(b);s.appendChild(d);
});

});
document.getElementById("q").addEventListener("input",function(e){
var t=e.target.value.trim().toLowerCase(),any=false;
main.querySelectorAll("section").forEach(function(s){
var vis=0;
s.querySelectorAll("details").forEach(function(d){
var ok=!t||d.textContent.toLowerCase().indexOf(t)>-1;
d.style.display=ok?"":"none";
if(ok)vis++;
if(t&&ok)d.open=true;
if(!t)d.open=false;
});
s.style.display=vis?"":"none";
if(vis)any=true;
});
none.style.display=any?"none":"block";
});
